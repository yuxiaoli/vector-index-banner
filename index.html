<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="An original ASCII signal experiment for Vector Index. Move through the field and watch meaning emerge.">
  <title>Vector Index — Signal / 001</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="scene" id="scene" aria-label="Vector Index interactive ASCII banner">
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="crt" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>
    <header class="masthead">
      <a class="identity" href="./" aria-label="Vector Index, replay home"><svg viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M4 5h6l4 13 4-13h6L14 25 4 5Z" stroke="currentColor" stroke-width="1.2"/><path d="m6 10 8 4 8-4" stroke="currentColor" stroke-width="1"/></svg><span>VECTOR INDEX</span></a>
      <span class="edition"><i></i>SIGNAL / 001</span>
    </header>
    <div class="hero-copy">
      <p class="eyebrow">ORDER WITHIN THE INFINITE</p>
      <h1 class="sr-only">Vector Index</h1>
      <div class="fallback" id="fallback" aria-hidden="true">VECTOR INDEX</div>
      <p class="tagline">Meaning, in every dimension.</p>
    </div>
    <footer class="footer">
      <div class="signature"><span class="plus">+</span><span>FROM NOISE TO KNOWLEDGE</span></div>
      <div class="motion-panel">
      <p class="footer-credit">Created by <a href="https://www.linkedin.com/in/yuxiaoli/">Sean</a> with ❤️</p>
      <p class="motion-status" id="status" role="status" aria-live="polite">Loading animation.</p>
      <div class="controls" role="group" aria-label="Animation controls" aria-describedby="status">
        <div class="timing-controls">
          <div class="timing-control"><label for="flow-speed">Flow speed <output id="flow-value" for="flow-speed">1.00×</output></label><input id="flow-speed" type="range" min="0.25" max="2" step="0.05" value="1" aria-describedby="timing-help"></div>
          <div class="timing-control"><label for="formation-duration">Total formation time <output id="duration-value" for="formation-duration">45s</output></label><input id="formation-duration" type="range" min="30" max="60" step="1" value="45" aria-describedby="timing-help"></div>
        </div>
        <div class="control-buttons">
        <button id="motion" type="button" aria-pressed="true" aria-label="Turn animation motion off" title="Show a still composition"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 10V6m4 7V3m4 11V2m4 9V5"/></svg><span class="motion-label">Motion</span><span class="motion-state">on</span></button>
        <button id="pause" type="button" aria-label="Pause animation"><svg viewBox="0 0 16 16" aria-hidden="true"><path class="pause-shape" d="M5 3v10M11 3v10"/><path class="play-shape" d="m5 3 7 5-7 5Z"/></svg><span>Pause</span></button>
        <button id="replay" type="button" aria-label="Replay reveal"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6a5 5 0 1 1 .5 5M3 2v4h4"/></svg><span>Replay</span></button>
        </div>
        <p class="timing-help" id="timing-help">Includes a 10-second opening. Changes remaining pace; Replay starts a full cycle.</p>
      </div>
      </div>
    </footer>
    <div class="coordinates" aria-hidden="true"><span>V / ∞</span><span>ASCII FIELD</span></div>
  </main>
  <noscript><style>.fallback{display:block!important}.controls,.motion-status{display:none}</style></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
